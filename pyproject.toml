[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coinappraiser"
version = "0.1.0"
description = "Photo-based coin identification with cited numismatic price references."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.60,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
coinappraiser = "coinappraiser.cli:main"
coinappraiser-import-catalog = "coinappraiser.importer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coinappraiser = ["catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
